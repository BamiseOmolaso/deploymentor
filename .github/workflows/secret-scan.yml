name: Secret scan

# Fails the build if a secret (API key, token, private key) is found anywhere
# in the repository history. Runs gitleaks from its official image, so no
# third-party action or licence is needed. Known false positives live in
# .gitleaksignore, one exact fingerprint per line.
on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Full history, not just the latest commit: a secret deleted in a later
      # commit is still in Git and still counts as leaked.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --redact keeps the secret itself out of the public build log.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner
